name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linkedin_agent_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d linkedin_agent_analytics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/linkedin_agent_analytics

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database schema
        run: |
          python -c "from pathlib import Path; from src.ingestion.database import get_engine; e=get_engine(); c=e.connect(); c.exec_driver_sql(Path('database/schema.sql').read_text()); c.exec_driver_sql(Path('docs/star_schema.sql').read_text()); c.exec_driver_sql(Path('database/dq_schema.sql').read_text()); c.commit(); c.close()"

      - name: Run tests
        run: |
          python -m pytest -q

  pipeline:
    name: Run data quality pipeline
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linkedin_agent_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d linkedin_agent_analytics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/linkedin_agent_analytics

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database schema
        run: |
          python -c "from pathlib import Path; from src.ingestion.database import get_engine; e=get_engine(); c=e.connect(); c.exec_driver_sql(Path('database/schema.sql').read_text()); c.exec_driver_sql(Path('docs/star_schema.sql').read_text()); c.exec_driver_sql(Path('database/dq_schema.sql').read_text()); c.commit(); c.close()"

      - name: Run pipeline
        run: |
          python -m src.main

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t linkedin-agent-analytics:${{ github.sha }} .